<!DOCTYPE html>
<html>
<head>
    <title>Tabel HTML</title>
</head>

<body>

    <table width="500" border="1" cellspacing="1" cellpadding="10">

        <caption>Ini adalah tabel</caption>

        <tr>
            <th>kolom 1</th>
            <th>kolom 2</th>
        </tr>

        <tr>
            <td>baris 1 kolom 1</td>
            <td>baris 1 kolom 2</td>
        </tr>

        <tr>
            <td>baris 2 kolom 1</td>
            <td>baris 2 kolom 2</td>
        </tr>

    </table>

</body>
</html>
